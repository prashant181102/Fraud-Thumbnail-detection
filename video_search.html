<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Search - FraudGuard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .logo-icon i {
            font-size: 1.5rem;
            color: white;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .search-container {
            background: rgba(255, 255, 255, 0.95);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .search-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 10px;
            text-align: center;
        }

        .search-subtitle {
            color: #6b7280;
            text-align: center;
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-container {
            display: none;
        }

        .results-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
        }

        .results-count {
            color: #6b7280;
            font-size: 1rem;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .video-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
        }

        .video-info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-channel {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .video-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .fraud-indicator {
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            margin-top: auto;
        }

        .risk-very-low {
            background: #d1fae5;
            color: #065f46;
            font-weight: 600;
        }

        .risk-low {
            background: #d1fae5;
            color: #065f46;
        }

        .risk-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .risk-high {
            background: #fee2e2;
            color: #991b1b;
        }

        .risk-very-high {
            background: #fee2e2;
            color: #7f1d1d;
            font-weight: 700;
        }

        .fraud-score {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2rem;
        }

        .loading i {
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(254, 226, 226, 0.95);
            color: #991b1b;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .no-results {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: #6b7280;
        }

        .sort-options {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-btn {
            padding: 8px 15px;
            background: #f3f4f6;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .sort-btn:hover {
            background: #e5e7eb;
        }

        .sort-btn.active {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="logo-text">FraudGuard</div>
            </div>
            <div class="nav-links">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/fraud-detection" class="nav-link">Fraud Detection</a>
                <a href="/video-search" class="nav-link" style="background: rgba(102, 126, 234, 0.1);">Video Search</a>
            </div>
        </div>

        <div class="search-container">
            <h1 class="search-title">Search YouTube Videos</h1>
            <p class="search-subtitle">Find videos on any topic, ranked by fraud probability (lowest fraud first)</p>
            <form class="search-form" id="searchForm">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Enter topic or keywords (e.g., 'machine learning tutorial', 'cooking recipes')"
                    required
                >
                <button type="submit" class="search-btn" id="searchBtn">
                    <i class="fas fa-search"></i>
                    Search
                </button>
            </form>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner"></i>
            Searching and analyzing videos...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="resultsContainer" class="results-container">
            <div class="results-header">
                <div>
                    <h2 class="results-title">Search Results</h2>
                    <p class="results-count" id="resultsCount"></p>
                </div>
                <div class="sort-options">
                    <button class="sort-btn active" id="sortLowFraud">Lowest Fraud First</button>
                    <button class="sort-btn" id="sortHighFraud">Highest Fraud First</button>
                </div>
            </div>
            <div class="videos-grid" id="videosGrid"></div>
        </div>

        <div id="noResults" class="no-results" style="display: none;">
            <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.3;"></i>
            <h3>No videos found</h3>
            <p>Try a different search query</p>
        </div>
    </div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultsContainer = document.getElementById('resultsContainer');
        const videosGrid = document.getElementById('videosGrid');
        const resultsCount = document.getElementById('resultsCount');
        const noResults = document.getElementById('noResults');
        const sortLowFraud = document.getElementById('sortLowFraud');
        const sortHighFraud = document.getElementById('sortHighFraud');

        let currentVideos = [];
        let sortOrder = 'asc'; // 'asc' for lowest fraud first, 'desc' for highest fraud first

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            
            if (!query) {
                showError('Please enter a search query');
                return;
            }

            // Hide previous results
            resultsContainer.style.display = 'none';
            noResults.style.display = 'none';
            error.style.display = 'none';
            
            // Show loading
            loading.style.display = 'block';
            searchBtn.disabled = true;

            try {
                const response = await fetch('/search-videos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        max_results: 20
                    })
                });

                const data = await response.json();

                loading.style.display = 'none';
                searchBtn.disabled = false;

                if (!response.ok) {
                    showError(data.error || 'Search failed. Please try again.');
                    return;
                }

                if (data.success && data.videos && data.videos.length > 0) {
                    currentVideos = data.videos;
                    displayVideos(currentVideos);
                    resultsCount.textContent = `Found ${data.total_results} videos for "${data.query}"`;
                    resultsContainer.style.display = 'block';
                } else {
                    noResults.style.display = 'block';
                }

            } catch (err) {
                loading.style.display = 'none';
                searchBtn.disabled = false;
                showError('Network error. Please check your connection and try again.');
                console.error('Search error:', err);
            }
        });

        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }

        function displayVideos(videos) {
            videosGrid.innerHTML = '';
            
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                
                const riskClass = getRiskClass(video.fraud_probability);
                
                card.innerHTML = `
                    <img src="${video.thumbnail_url}" alt="${video.title}" class="video-thumbnail" onclick="window.open('${video.url}', '_blank')">
                    <div class="video-info">
                        <h3 class="video-title" onclick="window.open('${video.url}', '_blank')" style="cursor: pointer;">${video.title}</h3>
                        <p class="video-channel">
                            <i class="fas fa-user"></i> ${video.channel}
                        </p>
                        <div class="video-stats">
                            <div class="stat-item">
                                <i class="fas fa-eye"></i>
                                ${formatNumber(video.view_count)}
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-thumbs-up"></i>
                                ${formatNumber(video.like_count)}
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-comments"></i>
                                ${formatNumber(video.comment_count)}
                            </div>
                        </div>
                        <div class="fraud-indicator ${riskClass}">
                            ${video.risk_level}
                            <div class="fraud-score">Fraud Score: ${(video.fraud_probability * 100).toFixed(1)}%</div>
                        </div>
                    </div>
                `;
                
                videosGrid.appendChild(card);
            });
        }

        function getRiskClass(probability) {
            if (probability < 0.15) return 'risk-very-low';
            if (probability < 0.30) return 'risk-low';
            if (probability < 0.50) return 'risk-medium';
            if (probability < 0.70) return 'risk-high';
            return 'risk-very-high';
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function sortVideos(order) {
            if (currentVideos.length === 0) return;
            
            sortOrder = order;
            const sorted = [...currentVideos];
            
            if (order === 'asc') {
                sorted.sort((a, b) => a.fraud_probability - b.fraud_probability);
                sortLowFraud.classList.add('active');
                sortHighFraud.classList.remove('active');
            } else {
                sorted.sort((a, b) => b.fraud_probability - a.fraud_probability);
                sortHighFraud.classList.add('active');
                sortLowFraud.classList.remove('active');
            }
            
            displayVideos(sorted);
        }

        sortLowFraud.addEventListener('click', () => sortVideos('asc'));
        sortHighFraud.addEventListener('click', () => sortVideos('desc'));
    </script>
</body>
</html>
